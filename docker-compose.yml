services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: nmapuser
      POSTGRES_PASSWORD: nmap-pass
      POSTGRES_DB: nmapdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - SQLALCHEMY_DATABASE_URL=postgresql://nmapuser:nmap-pass@db/nmapdb
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - SQLALCHEMY_DATABASE_URL=postgresql://nmapuser:nmap-pass@db/nmapdb
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
